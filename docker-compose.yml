services:
  frontend:
    image: ${TP_ACR_REGISTRY}/thingspanel-vue:${TP_TAG_FRONTEND:-1.2-release}
    ports:
      - "${TP_HTTP_PORT:-18080}:8080"
    environment:
      - "TZ=Asia/Shanghai"
      - "BACKEND_HOST=http://backend:9999"
    depends_on:
      backend:
        condition: service_started
    volumes:
      - nginx:/etc/nginx
    restart: unless-stopped
    networks:
      - thingspanel_network

  postgres:
    image: ${TP_ACR_REGISTRY}/timescaledb:${TP_TAG_TIMESCALEDB:-14}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${TP_POSTGRES_PORT:-15555}:5432"
    environment:
      - "TZ=Asia/Shanghai"
      - "LC_ALL=C.UTF-8"
      - "POSTGRES_DB=ThingsPanel"
      - "POSTGRES_USER=postgres"
      - "POSTGRES_PASSWORD=${TP_DATABASE_PASSWORD:-postgresThingsPanel}"
      - "POSTGRES_HOST_AUTH_METHOD=md5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ThingsPanel"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - thingspanel_network

  gmqtt:
    image: ${TP_ACR_REGISTRY}/thingspanel-gmqtt:${TP_TAG_GMQTT:-1.2-release}
    volumes:
      - gmqtt:/gmqttd
    ports:
      - "${TP_MQTT_PORT:-11883}:1883"
      - "${TP_GMQTT_WS_PORT:-18082}:8082"
      - "${TP_GMQTT_API_PORT:-18083}:8083"
    environment:
      - "TZ=Asia/Shanghai"
      - "GMQTT_DB_REDIS_CONN=redis:6379"
      - "GMQTT_DB_REDIS_PASSWORD=${TP_REDIS_PASSWORD:-redis}"
      - "GMQTT_DB_PSQL_PSQLADDR=postgres"
      - "GMQTT_DB_PSQL_PSQLPORT=5432"
      - "GMQTT_DB_PSQL_PSQLDB=ThingsPanel"
      - "GMQTT_DB_PSQL_PSQLUSER=postgres"
      - "GMQTT_DB_PSQL_PSQLPASS=${TP_DATABASE_PASSWORD:-postgresThingsPanel}"
    hostname: gmqtt
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - thingspanel_network

  redis:
    image: ${TP_ACR_REGISTRY}/redis:${TP_TAG_REDIS:-6.2.7}
    command: redis-server --requirepass ${TP_REDIS_PASSWORD:-redis}
    volumes:
      - redis_data:/data
    ports:
      - "${TP_REDIS_PORT:-16379}:6379"
    environment:
      - "TZ=Asia/Shanghai"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${TP_REDIS_PASSWORD:-redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - thingspanel_network

  backend:
    image: ${TP_ACR_REGISTRY}/thingspanel-go:${TP_TAG_BACKEND:-1.2-release}
    ports:
      - "${TP_BACKEND_PORT:-19999}:9999"
    environment:
      - "TZ=Asia/Shanghai"
      - "GOTP_DB_PSQL_HOST=postgres"
      - "GOTP_DB_PSQL_PORT=5432"
      - "GOTP_DB_PSQL_USERNAME=postgres"
      - "GOTP_DB_PSQL_PASSWORD=${TP_DATABASE_PASSWORD:-postgresThingsPanel}"
      - "GOTP_DB_PSQL_DBNAME=ThingsPanel"
      - "GOTP_DB_PSQL_LOG_LEVEL=3"
      - "GOTP_DB_REDIS_ADDR=redis:6379"
      - "GOTP_DB_REDIS_PASSWORD=${TP_REDIS_PASSWORD:-redis}"
      - "GOTP_MQTT_SERVER=gmqtt"
      - "GOTP_MQTT_ACCESS_ADDRESS=gmqtt:1883"
      - "GOTP_MQTT_BROKER=gmqtt:1883"
      - "GOTP_LOG_LEVEL=error"
      - "GOTP_THINGSVIS_PUBLIC_API_BASE_URL=http://thingsvis-server:8000/api/v1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gmqtt:
        condition: service_started
    volumes:
      - go_files:/go/src/app/files
      - go_configs:/go/src/app/configs
    restart: unless-stopped
    networks:
      - thingspanel_network

  modbus_service:
    image: ${TP_ACR_REGISTRY}/modbus-protocol-plugin:${TP_TAG_MODBUS:-1.2-release}
    ports:
      - "${TP_MODBUS_PORT:-1502}:502"
      - "${TP_MODBUS_HTTP_PORT:-1503}:503"
    environment:
      - "MODBUS_THINGSPANEL_ADDRESS=http://backend:9999"
      - "MODBUS_MQTT_BROKER=gmqtt:1883"
      - "MODBUS_MQTT_QOS=0"
      - "MODBUS_EXCEPTION_REPORT_ENABLED=true"
    networks:
      - thingspanel_network
    depends_on:
      - backend
      - gmqtt
    restart: unless-stopped

  http_adapter:
    image: ${TP_ACR_REGISTRY}/thingspanel-adapter-http:${TP_TAG_HTTP_ADAPTER:-1.2-release}
    ports:
      - "${TP_HTTP_ADAPTER_PORT:-29090}:19090"
      - "${TP_HTTP_ADAPTER_HTTP_PORT:-29091}:19091"
    environment:
      - "TZ=Asia/Shanghai"
      - "P_SERVER_PORT=19090"
      - "P_SERVER_HTTP_PORT=19091"
      - "P_PLATFORM_URL=http://backend:9999"
      - "P_PLATFORM_MQTT_BROKER=tcp://gmqtt:1883"
    networks:
      - thingspanel_network
    depends_on:
      - backend
      - gmqtt
    restart: unless-stopped

  thingsvis-server:
    image: ${TP_ACR_REGISTRY}/thingsvis-server:${TP_TAG_THINGSVIS:-1.2-release}
    container_name: thingsvis-server-1-2
    restart: unless-stopped
    ports:
      - "${TP_THINGSVIS_SERVER_PORT:-18000}:8000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - AUTH_TRUST_HOST=true
      - DATABASE_URL=postgresql://postgres:${TP_DATABASE_PASSWORD:-postgresThingsPanel}@postgres:5432/ThingsPanel?schema=thingsvis
      - AUTH_SECRET=${TP_THINGSVIS_AUTH_SECRET:-change-me-thingsvis-auth-secret-please-override}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - thingspanel_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --spider http://127.0.0.1:8000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  thingsvis-studio:
    image: ${TP_ACR_REGISTRY}/thingsvis-studio:${TP_TAG_THINGSVIS:-1.2-release}
    container_name: thingsvis-studio-1-2
    restart: unless-stopped
    ports:
      - "${TP_THINGSVIS_STUDIO_PORT:-13000}:3000"
    environment:
      - STUDIO_PORT=3000
      - SERVER_HOST=thingsvis-server
      - SERVER_PORT=8000
    depends_on:
      thingsvis-server:
        condition: service_healthy
    networks:
      - thingspanel_network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  go_files:
  go_configs:
  gmqtt:
  nginx:
  postgres_data:
  redis_data:

networks:
  thingspanel_network:
    driver: bridge
